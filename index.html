<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잇다 v4.2 — 구조/콘텐츠 분리 빌드</title>
<!--
  ═══════════════════════════════════════════════════════════════
  v4.1 아키텍처 — 구조와 콘텐츠의 분리
  ┌ index.html        구조 + 인터랙션 (동결. 원칙적으로 수정 안 함)
  ├ content.base.js   기본 문구/이미지 세트
  └ content.cd.js     CD 수정 세트 (별도 저장)

  세트 전환:  index.html          → base
             index.html?set=cd   → CD 수정본
  이미지:     content 파일의 URL만 채우면 자동 반영 (빈값 = 플레이스홀더)
  ═══════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0e0e10; --ink:#f4f2ee; --mute:#8b8985;
  --line:rgba(244,242,238,.14); --accent:#ffc845; --media:#1c1c20;
  --font:'Pretendard Variable',Pretendard,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:-.01em;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:#0e0e10}
img,video{display:block;max-width:100%}
.media{background:var(--media);border:1px dashed rgba(244,242,238,.18);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;overflow:hidden;position:relative}
.media.filled{border-style:solid;border-color:transparent}
.media video,.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wrap{padding-inline:clamp(20px,4vw,56px)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}

/* 세트 배지 (좌하단, 현재 콘텐츠 세트 표시) */
.set-badge{position:fixed;left:16px;bottom:16px;z-index:95;font-size:11px;letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:rgba(14,14,16,.7);backdrop-filter:blur(6px)}
.set-badge b{color:var(--accent);font-weight:700}
.set-badge a{margin-left:8px;text-decoration:underline}

/* ═══ S0 헤더 ═══ */
header{position:fixed;inset:0 0 auto 0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,4vw,56px);transition:background .4s,backdrop-filter .4s}
header.scrolled{background:rgba(14,14,16,.72);backdrop-filter:blur(12px)}
.logo{font-weight:800;font-size:20px}.logo em{color:var(--accent);font-style:normal}
nav{display:flex;gap:26px;font-size:14px;color:var(--mute)}
nav a:hover{color:var(--ink)}
.contact-pill{border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-size:13px;transition:.3s}
.contact-pill:hover{background:var(--accent);color:#0e0e10;border-color:var(--accent)}
@media(max-width:760px){nav{display:none}}

/* ═══ 푸터 리빌 구조 ═══ */
.main{position:relative;z-index:2;background:var(--bg);box-shadow:0 40px 80px rgba(0,0,0,.5)}
footer{position:sticky;bottom:0;z-index:1;min-height:94svh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px clamp(20px,4vw,56px) 28px;overflow:hidden}

/* ═══ S1 히어로 ═══ */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6svh;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,16,.25),rgba(14,14,16,.75))}
.hero-inner{position:relative;z-index:2}
.hero h1{font-size:clamp(48px,11vw,160px);line-height:.96;font-weight:800;letter-spacing:-.04em}
.hero h1 .ch{display:inline-block;transform:translateY(120%);opacity:0}
.hero h1 .row{overflow:hidden;display:block}
.hero-sub{margin-top:22px;color:var(--mute);font-size:clamp(14px,1.6vw,18px);max-width:520px;opacity:0;transform:translateY(20px)}
.hero-meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8svh;font-size:12px;color:var(--mute);letter-spacing:.16em;text-transform:uppercase}
.mascot{position:absolute;top:18svh;right:clamp(20px,4vw,56px);z-index:3;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(-10px)}
.mascot .face{width:52px;height:52px;border-radius:50%}
.mascot .bubble{border:1px solid var(--line);border-radius:14px 14px 14px 2px;padding:8px 12px;font-size:12px;color:var(--mute);background:rgba(14,14,16,.6);backdrop-filter:blur(6px)}
@media(max-width:760px){.mascot{display:none}}

/* ═══ S2 스테이트먼트 ═══ */
.statement{padding:22svh 0}
.statement .eyebrow{margin-bottom:26px}
.statement p.big{font-size:clamp(26px,4.4vw,56px);font-weight:700;line-height:1.28;letter-spacing:-.02em;max-width:20ch}
.statement .w{color:rgba(244,242,238,.18);transition:color .25s}
.statement .w.on{color:var(--ink)}

/* ═══ S3 프로세스 ═══ */
.process-pin{min-height:100svh;display:flex;flex-direction:column;justify-content:center}
.step{display:flex;align-items:baseline;gap:clamp(16px,3vw,40px);padding:clamp(10px,2.4vh,22px) 0;border-top:1px solid var(--line);color:rgba(244,242,238,.22);transition:color .35s}
.step:last-child{border-bottom:1px solid var(--line)}
.step .num{font-size:13px;letter-spacing:.14em;width:44px;flex:none}
.step .name{font-size:clamp(30px,6vw,76px);font-weight:800;letter-spacing:-.03em;line-height:1}
.step .desc{margin-left:auto;font-size:clamp(15px,1.6vw,20px);font-weight:600;max-width:400px;opacity:0;transform:translateX(110px);transition:.65s cubic-bezier(.2,.8,.2,1)}
.step.on{color:var(--ink)}
.step.on .desc{opacity:1;transform:none;color:var(--accent)}
@media(max-width:760px){.step .desc{display:none}}

/* ═══ S4 ★ 쇼케이스 ═══ */
.showcase-pin{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:flex-end}
.stage{position:absolute;inset:0;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(90deg,rgba(14,14,16,.1) 25%,rgba(14,14,16,.92) 78%);pointer-events:none}
.stage .shot{position:absolute;inset:0;clip-path:inset(0 0 100% 0);will-change:clip-path}
.stage .shot.on{clip-path:inset(0 0 0% 0)}
.stage .badge{position:absolute;left:18px;top:18px;z-index:5;font-size:11px;letter-spacing:.18em;text-transform:uppercase;background:rgba(14,14,16,.65);border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(6px)}
.sc-list{position:relative;z-index:6;width:min(640px,92%);padding:0 clamp(20px,4vw,56px)}
.sc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.sc-head h2{font-size:clamp(26px,3.4vw,44px);font-weight:800;letter-spacing:-.02em;white-space:pre-line}
.sc-count{font-size:13px;color:var(--mute);letter-spacing:.14em}
.sc-count b{color:var(--accent);font-weight:700}
.sc-item{border-top:1px solid var(--line);padding:16px 0;display:flex;align-items:baseline;gap:16px;color:rgba(244,242,238,.3);transition:color .3s;cursor:pointer}
.sc-item:last-child{border-bottom:1px solid var(--line)}
.sc-item .idx{font-size:12px;letter-spacing:.12em;width:32px;flex:none}
.sc-item .t{font-size:clamp(18px,2vw,26px);font-weight:700}
.sc-item .tag{margin-left:auto;font-size:12px;opacity:0;transform:translateX(10px);transition:.3s}
.sc-item.on{color:var(--ink)}
.sc-item.on .idx{color:var(--accent)}
.sc-item.on .tag{opacity:1;transform:none;color:var(--mute)}
@media(max-width:900px){.showcase-pin{justify-content:center}.stage::before{background:linear-gradient(180deg,rgba(14,14,16,.3),rgba(14,14,16,.93))}.sc-list{width:100%}}
.cursor{position:fixed;z-index:99;left:0;top:0;width:88px;height:88px;border-radius:50%;background:var(--accent);color:#0e0e10;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;pointer-events:none;transform:translate(-50%,-50%) scale(0)}

/* ═══ S5 낙하 타이포 ═══ */
.fall{padding:16svh 0;display:flex;justify-content:center}
.fall-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.fall-col span{font-size:clamp(26px,4.6vw,58px);font-weight:800;line-height:1.15;display:block;will-change:transform,opacity}
.fall-col .punct{color:var(--accent)}

/* ═══ S6 카드 ═══ */
.cards{padding:14svh 0}
.cards-head{margin-bottom:44px;display:flex;align-items:baseline;justify-content:space-between}
.cards-head h2{font-size:clamp(28px,4vw,52px);font-weight:800}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{border:1px solid var(--line);border-radius:18px;padding:26px;min-height:340px;display:flex;flex-direction:column;gap:18px;transition:transform .35s,border-color .35s}
.card:hover{transform:translateY(-8px);border-color:rgba(255,200,69,.5)}
.card .no{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.card .icon{width:96px;height:96px;border-radius:14px}
.card h3{font-size:20px;font-weight:800;margin-top:auto}
.card p{font-size:14px;line-height:1.6;color:var(--mute)}
a.card{text-decoration:none}
.card .go{font-size:13px;color:var(--accent);opacity:0;transform:translateX(-6px);transition:.3s}
.card:hover .go{opacity:1;transform:none}
.icon.emoji{font-size:44px;border-style:solid;border-color:rgba(255,200,69,.25);background:rgba(255,200,69,.06)}
@media(max-width:860px){.card-grid{grid-template-columns:1fr}}

/* ═══ S7 키워드 ═══ */
.keywords{padding:8svh 0 14svh}
.kw-row{border-top:1px solid var(--line);padding:clamp(28px,5vh,52px) clamp(20px,7vw,120px);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;overflow:hidden}
.kw-row:last-child{border-bottom:1px solid var(--line)}
.kw-line{display:flex;align-items:center;gap:22px;white-space:nowrap;will-change:transform}
.kw-line h2{font-size:clamp(34px,6.6vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1}
.kw-line h2 .ghost{color:rgba(244,242,238,.14)}
.kw-line .kicon{width:clamp(44px,5.6vw,72px);height:clamp(44px,5.6vw,72px);border-radius:12px;flex:none}
.kw-sub{font-size:clamp(14px,1.5vw,17px);line-height:1.6;color:var(--mute);max-width:260px;text-align:right}
.kw-sub b{color:var(--ink)}
@media(max-width:760px){.kw-row{grid-template-columns:1fr}.kw-sub{text-align:left;max-width:none}}

/* ═══ S8 갤러리 ═══ */
.gallery{padding:12svh 0;overflow:hidden}
.gal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px}
.gal-head h2{font-size:clamp(26px,3.6vw,46px);font-weight:800}
.gal-track{display:flex;gap:16px;cursor:grab;will-change:transform;touch-action:pan-y}
.gal-track:active{cursor:grabbing}
.gal-card{flex:none;width:clamp(220px,26vw,340px);aspect-ratio:3/4;border-radius:16px;user-select:none}
.drag-badge{position:fixed;z-index:98;left:0;top:0;pointer-events:none;font-size:12px;font-weight:700;letter-spacing:.2em;background:var(--ink);color:#0e0e10;border-radius:999px;padding:10px 16px;transform:translate(-50%,-50%) scale(0)}

/* ═══ S9 기록 ═══ */
.awards{padding:12svh 0}
.aw-marquee{display:flex;gap:14px;overflow:hidden;margin-bottom:52px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.aw-strip{display:flex;gap:14px;flex:none;animation:aw 26s linear infinite}
.aw-strip .media{width:220px;aspect-ratio:4/3;border-radius:12px;flex:none}
@keyframes aw{to{transform:translateX(calc(-100% - 14px))}}
.aw-list{max-width:1000px;margin:0 auto;width:100%}
.aw-item{display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:baseline;border-top:1px solid var(--line);padding:20px 0;color:var(--mute);transition:color .3s}
.aw-item:hover{color:var(--ink)}
.aw-item .no{font-size:12px;letter-spacing:.14em}
.aw-item .t{font-size:clamp(18px,2.2vw,26px);font-weight:700}
.aw-item .cat{font-size:13px}
.aw-item .cat em{color:var(--accent);font-style:normal;margin-left:10px}

/* ═══ S10 푸터 ═══ */
.f-bg{position:absolute;inset:0;z-index:0;opacity:.5}
.f-inner{position:relative;z-index:2}
.f-cta{font-size:clamp(40px,8vw,110px);font-weight:800;letter-spacing:-.04em;line-height:1.02}
.f-cta em{color:var(--accent);font-style:normal}
.f-note{margin-top:20px;color:var(--mute);font-size:14px}
.f-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-top:9svh;border-top:1px solid var(--line);padding-top:24px;font-size:13px;color:var(--mute)}
.f-grid .col p{margin:4px 0}
.f-links{display:flex;gap:18px}
.f-links a:hover{color:var(--ink)}
.f-mascots{display:flex;gap:10px;margin-top:18px}
.f-mascots .media{width:88px;height:88px;border-radius:14px}
.top-btn{position:fixed;right:22px;bottom:22px;z-index:80;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:rgba(14,14,16,.7);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:.3s}
.top-btn.show{opacity:1;pointer-events:auto}
.top-btn:hover{background:var(--accent);color:#0e0e10;border-color:var(--accent)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .hero h1 .ch{transform:none;opacity:1}
  .hero-sub,.mascot{opacity:1;transform:none}
}
</style>
</head>
<body>

<header id="hd">
  <a class="logo" href="#">잇다<em>.</em></a>
  <nav id="nav"></nav>
  <a class="contact-pill" id="contactPill" href="#footer"></a>
</header>

<div class="main">
  <section class="hero wrap">
    <div class="hero-bg media" id="heroBg">HERO MEDIA</div>
    <div class="mascot" id="mascot">
      <div class="bubble" id="mascotSay"></div>
      <div class="media face" id="mascotFace">🐾</div>
    </div>
    <div class="hero-inner">
      <h1 id="heroTitle"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-meta"><span>Scroll Down ↓</span><span>© 2026 ITDA — Ilsan</span></div>
    </div>
  </section>

  <section class="statement wrap">
    <p class="eyebrow" id="stmtEyebrow"></p>
    <p class="big" id="stmt"></p>
  </section>

  <section class="process wrap">
    <div class="process-pin" id="processPin"></div>
  </section>

  <section class="showcase wrap" id="showcase">
    <div class="showcase-pin" id="showcasePin">
      <div class="stage" id="stage"><span class="badge" id="scBadge"></span></div>
      <div class="sc-list">
        <div class="sc-head">
          <h2 id="scHeading"></h2>
          <span class="sc-count"><b id="scNow">01</b> / <span id="scTotal">05</span></span>
        </div>
        <div id="scItems"></div>
      </div>
    </div>
  </section>

  <section class="fall"><div class="fall-col" id="fallCol"></div></section>

  <section class="cards wrap" id="cards">
    <div class="cards-head"><h2 id="cardsHeading"></h2><span class="eyebrow" id="cardsEyebrow"></span></div>
    <div class="card-grid" id="cardGrid"></div>
  </section>

  <section class="keywords wrap" id="kwRows"></section>

  <section class="gallery" id="gallery">
    <div class="gal-head wrap"><h2 id="galHeading"></h2><span class="eyebrow">Drag →</span></div>
    <div class="gal-track wrap" id="galTrack"></div>
  </section>

  <section class="awards wrap" id="awards">
    <p class="eyebrow" id="awEyebrow" style="margin-bottom:26px"></p>
    <div class="aw-marquee" id="awMarquee"></div>
    <div class="aw-list" id="awList"></div>
  </section>
</div>

<footer id="footer">
  <div class="f-bg media" id="fBg">FOOTER MEDIA</div>
  <div class="f-inner">
    <p class="eyebrow" id="fEyebrow" style="margin-bottom:18px"></p>
    <h2 class="f-cta" id="fCta"></h2>
    <p class="f-note" id="fNote"></p>
    <div class="f-mascots" id="fMascots"></div>
    <div class="f-grid">
      <div class="col" id="fAddress"></div>
      <div class="f-links" id="fLinks"></div>
    </div>
    <p style="margin-top:22px;font-size:12px;color:var(--mute)" id="fCopy"></p>
  </div>
</footer>

<div class="cursor" id="cursor">보기 →</div>
<div class="drag-badge" id="dragBadge">DRAG</div>
<button class="top-btn" id="topBtn" aria-label="맨 위로">TOP</button>
<div class="set-badge" id="setBadge"></div>

<!-- 콘텐츠 세트 (둘 다 로드, URL 파라미터로 선택) -->
<script src="content.base.js"></script>
<script src="content.cd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
/* ═══════════════════ 세트 선택 ═══════════════════ */
const SET_KEY = new URLSearchParams(location.search).get('set') || 'base';
const C = (window.ITDA_SETS && (ITDA_SETS[SET_KEY] || ITDA_SETS.base)) || null;
if(!C){ document.body.innerHTML = '<p style="padding:40px">content.*.js 로드 실패 — 같은 폴더에 있는지 확인</p>'; throw new Error('no content'); }

/* 세트 배지 */
const other = SET_KEY === 'cd' ? 'base' : 'cd';
document.getElementById('setBadge').innerHTML =
  `SET <b>${SET_KEY.toUpperCase()}</b> · ${C.meta.version}<a href="?set=${other}">→ ${other.toUpperCase()}</a>`;

/* ═══════════════════ 렌더 헬퍼 ═══════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nl2br = s => esc(s).replace(/\n/g,'<br>');
const bold = s => nl2br(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

/* 미디어 채우기: mp4 → video, 그 외 → img (referrer 차단 + 폴백) */
function fillMedia(el, url, label){
  if(!url){ if(label) el.textContent = label; return; }
  if(url.length<=4 && !url.includes('http')){ el.classList.add('filled','emoji'); el.textContent=url; return; }
  el.classList.add('filled'); el.textContent = '';
  if(/\.mp4($|\?)/.test(url)){
    const v = document.createElement('video');
    Object.assign(v,{src:url,autoplay:true,muted:true,loop:true,playsInline:true});
    v.setAttribute('playsinline',''); el.appendChild(v);
  }else{
    const im = document.createElement('img');
    im.referrerPolicy = 'no-referrer';
    im.onerror = () => { im.src = 'https://picsum.photos/800/600?blur=2'; };
    im.src = url; im.alt = label || ''; el.appendChild(im);
  }
}

/* ═══════════════════ 렌더 ═══════════════════ */
/* 헤더 */
$('nav').innerHTML = C.nav.map(n=>`<a href="${esc(n.href)}">${esc(n.label)}</a>`).join('');
$('contactPill').textContent = C.contactLabel;

/* S1 히어로 */
C.hero.lines.forEach(line=>{
  const row = document.createElement('span'); row.className='row';
  [...line].forEach(c=>{
    const s=document.createElement('span'); s.className='ch';
    s.textContent = c===' ' ? '\u00A0' : c; row.appendChild(s);
  });
  $('heroTitle').appendChild(row);
});
$('heroSub').innerHTML = nl2br(C.hero.sub);
$('mascotSay').textContent = C.hero.mascotSay;
fillMedia($('heroBg'), C.hero.media, 'HERO MEDIA');
fillMedia($('mascotFace'), C.hero.mascotImg, '🐾');

/* S2 스테이트먼트 */
$('stmtEyebrow').textContent = C.statement.eyebrow;
$('stmt').innerHTML = C.statement.text.trim().split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(' ');

/* S3 프로세스 */
$('processPin').innerHTML = C.process.map((p,i)=>`
  <div class="step" data-step>
    <span class="num">${String(i+1).padStart(2,'0')}</span>
    <span class="name">${esc(p.name)}</span>
    <span class="desc">${esc(p.desc)}</span>
  </div>`).join('');

/* S4 쇼케이스 */
$('scBadge').textContent = C.showcase.badge;
$('scHeading').textContent = C.showcase.heading;
$('scTotal').textContent = String(C.showcase.items.length).padStart(2,'0');
C.showcase.items.forEach((it,i)=>{
  const shot = document.createElement('div');
  shot.className = 'shot media' + (i===0?' on':''); shot.dataset.shot='';
  $('stage').appendChild(shot);
  fillMedia(shot, it.img, esc(it.title)+' 이미지');
});
$('scItems').innerHTML = C.showcase.items.map((it,i)=>`
  <div class="sc-item${i===0?' on':''}" data-sc>
    <span class="idx">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${esc(it.title)}</span>
    <span class="tag">${esc(it.tag)}</span>
  </div>`).join('');

/* S5 낙하 타이포 */
C.fall.split(',').forEach(word=>{
  [...word].forEach(c=>{
    const s=document.createElement('span'); s.textContent=c;
    if(/[?!.,]/.test(c)) s.classList.add('punct');
    $('fallCol').appendChild(s);
  });
});

/* S6 카드 */
$('cardsHeading').textContent = C.cards.heading;
$('cardsEyebrow').textContent = C.cards.eyebrow;
C.cards.items.forEach(cd=>{
  const hasLink = cd.link && cd.link !== '#';
  const el = document.createElement(hasLink ? 'a' : 'div'); el.className='card';
  if(hasLink){ el.href=cd.link; el.target='_blank'; el.rel='noopener'; }
  el.innerHTML = `<span class="no">${esc(cd.no)}</span><div class="icon media"></div>
    <h3>${esc(cd.title)}</h3><p>${esc(cd.body)}</p>` + (hasLink?`<span class="go">노션에서 보기 →</span>`:``);
  fillMedia(el.querySelector('.icon'), cd.icon, '아이콘');
  $('cardGrid').appendChild(el);
});

/* S7 키워드 */
C.keywords.forEach((k,i)=>{
  const row = document.createElement('div');
  row.className='kw-row'; row.dataset.dir = i%2===0 ? '1' : '-1';
  row.innerHTML = `
    <div class="kw-line"><h2>${esc(k.word)}, <span class="ghost">${esc(k.word)},</span></h2>
      <div class="kicon media">◆</div></div>
    <p class="kw-sub">${bold(k.sub)}</p>`;
  fillMedia(row.querySelector('.kicon'), k.icon, '◆');
  $('kwRows').appendChild(row);
});

/* S8 갤러리 */
$('galHeading').textContent = C.gallery.heading;
C.gallery.imgs.forEach((url,i)=>{
  const el = document.createElement('div'); el.className='gal-card media';
  $('galTrack').appendChild(el);
  fillMedia(el, url, `현장 사진 ${i+1}`);
});

/* S9 기록 */
$('awEyebrow').textContent = C.awards.eyebrow;
for(let dup=0; dup<2; dup++){
  const strip = document.createElement('div'); strip.className='aw-strip';
  if(dup) strip.setAttribute('aria-hidden','true');
  C.awards.marquee.forEach((url,i)=>{
    const el = document.createElement('div'); el.className='media';
    strip.appendChild(el); fillMedia(el, url, `기록 ${i+1}`);
  });
  $('awMarquee').appendChild(strip);
}
$('awList').innerHTML = C.awards.list.map((a,i)=>{
  const inner = `
    <span class="no">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${esc(a.title)}</span>
    <span class="cat">${esc(a.cat)}<em>${esc(a.result)}</em></span>`;
  return (a.link && a.link!=='#')
    ? `<a class="aw-item" href="${esc(a.link)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="aw-item">${inner}</div>`;
}).join('');

/* S10 푸터 */
$('fEyebrow').textContent = C.footer.eyebrow;
$('fCta').innerHTML = C.footer.ctaLines.map(l=>esc(l).replace(/\*(.+?)\*/g,'<em>$1</em>')).join('<br>');
$('fNote').textContent = C.footer.note;
fillMedia($('fBg'), C.footer.bg, 'FOOTER MEDIA');
C.footer.mascots.forEach((url,i)=>{
  const el=document.createElement('div'); el.className='media';
  $('fMascots').appendChild(el); fillMedia(el,url,`마스코트${i+1}`);
});
$('fAddress').innerHTML = C.footer.address.map(l=>`<p>${esc(l)}</p>`).join('');
$('fLinks').innerHTML = C.footer.links.map(l=>(l.url&&l.url!=='#')?`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`:`<span>${esc(l.label)}</span>`).join('');
$('fCopy').textContent = C.footer.copyright;

/* ═══════════════════ 인터랙션 ═══════════════════ */
gsap.registerPlugin(ScrollTrigger);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

if(!reduce){
  gsap.timeline({delay:.2})
    .to('.hero h1 .ch',{y:0,opacity:1,duration:.9,ease:'power4.out',stagger:.02})
    .to('.hero-sub',{y:0,opacity:1,duration:.7,ease:'power3.out'},'-=.5')
    .to('#mascot',{y:0,opacity:1,duration:.6,ease:'back.out(1.6)'},'-=.3')
    .from('.hero-bg',{scale:1.12,duration:1.6,ease:'power2.out'},0);
}else{
  document.querySelectorAll('.hero h1 .ch').forEach(c=>{c.style.transform='none';c.style.opacity=1});
}

const hd=$('hd'), topBtn=$('topBtn');
ScrollTrigger.create({start:80,onToggle:st=>{hd.classList.toggle('scrolled',st.isActive);topBtn.classList.toggle('show',st.isActive)}});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:reduce?'auto':'smooth'}));

const words=document.querySelectorAll('#stmt .w');
ScrollTrigger.create({trigger:'.statement',start:'top 75%',end:'bottom 45%',scrub:true,
  onUpdate:st=>{const n=Math.floor(st.progress*words.length);words.forEach((w,i)=>w.classList.toggle('on',i<n))}});

const steps=document.querySelectorAll('[data-step]');
ScrollTrigger.create({trigger:'.process',start:'top top',end:'+=250%',pin:'#processPin',scrub:true,
  onUpdate:st=>{const n=Math.min(steps.length-1,Math.floor(st.progress*steps.length));
    steps.forEach((s,i)=>s.classList.toggle('on',i<=n))}});

const shots=document.querySelectorAll('[data-shot]');
const scItems=document.querySelectorAll('[data-sc]');
let scIdx=0;
function setShowcase(i){
  if(i===scIdx)return; scIdx=i;
  shots.forEach((s,k)=>{
    if(k===i){s.style.zIndex=2;gsap.to(s,{clipPath:'inset(0% 0% 0% 0%)',duration:reduce?0:.55,ease:'power3.inOut',onStart:()=>s.classList.add('on')})}
    else if(s.classList.contains('on')){s.style.zIndex=1;
      gsap.to(s,{clipPath:k<i?'inset(0% 0% 100% 0%)':'inset(100% 0% 0% 0%)',duration:reduce?0:.55,ease:'power3.inOut',onComplete:()=>s.classList.remove('on')})}
  });
  scItems.forEach((el,k)=>el.classList.toggle('on',k===i));
  $('scNow').textContent=String(i+1).padStart(2,'0');
}
ScrollTrigger.create({trigger:'.showcase',start:'top top',end:'+=350%',pin:'#showcasePin',scrub:true,
  onUpdate:st=>setShowcase(Math.min(shots.length-1,Math.floor(st.progress*shots.length)))});
scItems.forEach((el,i)=>el.addEventListener('click',()=>{
  const stg=ScrollTrigger.getAll().find(t=>t.pin&&t.pin.id==='showcasePin');
  if(stg)window.scrollTo({top:stg.start+(stg.end-stg.start)*((i+.5)/shots.length),behavior:reduce?'auto':'smooth'});
}));

const cursor=$('cursor'), stage=$('stage');
const cx=gsap.quickTo(cursor,'x',{duration:.35,ease:'power3'});
const cy=gsap.quickTo(cursor,'y',{duration:.35,ease:'power3'});
addEventListener('pointermove',e=>{cx(e.clientX);cy(e.clientY)});
stage.addEventListener('pointerenter',()=>gsap.to(cursor,{scale:1,duration:.3,ease:'back.out(2)'}));
stage.addEventListener('pointerleave',()=>gsap.to(cursor,{scale:0,duration:.25}));

gsap.from('#fallCol span',{y:'-60vh',opacity:0,rotate:()=>gsap.utils.random(-14,14),
  ease:'power2.out',stagger:.08,
  scrollTrigger:{trigger:'.fall',start:'top 80%',end:'bottom 60%',scrub:reduce?false:1}});

gsap.from('#cardGrid .card',{y:60,opacity:0,duration:.8,ease:'power3.out',stagger:.12,
  scrollTrigger:{trigger:'#cardGrid',start:'top 78%'}});

document.querySelectorAll('.kw-row').forEach(row=>{
  const dir=+row.dataset.dir||1;
  gsap.fromTo(row.querySelector('.kw-line'),{x:dir*70},{x:dir*-25,ease:'none',
    scrollTrigger:{trigger:row,start:'top bottom',end:'bottom top',scrub:true}});
  gsap.from(row.querySelector('.kw-sub'),{opacity:0,y:20,duration:.6,
    scrollTrigger:{trigger:row,start:'top 78%'}});
});

const track=$('galTrack'), badge=$('dragBadge');
let gx=0,startX=0,base=0,dragging=false;
const clampX=v=>gsap.utils.clamp(-(track.scrollWidth-track.parentElement.clientWidth+40),0,v);
track.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;base=gx;track.setPointerCapture(e.pointerId)});
track.addEventListener('pointermove',e=>{if(!dragging)return;gx=clampX(base+(e.clientX-startX));gsap.to(track,{x:gx,duration:.3,ease:'power2.out'})});
['pointerup','pointercancel'].forEach(ev=>track.addEventListener(ev,()=>dragging=false));
const bx=gsap.quickTo(badge,'x',{duration:.4,ease:'power3'});
const by=gsap.quickTo(badge,'y',{duration:.4,ease:'power3'});
addEventListener('pointermove',e=>{bx(e.clientX);by(e.clientY)});
const gal=$('gallery');
gal.addEventListener('pointerenter',()=>gsap.to(badge,{scale:1,duration:.3,ease:'back.out(2)'}));
gal.addEventListener('pointerleave',()=>gsap.to(badge,{scale:0,duration:.25}));

gsap.from('.aw-item',{opacity:0,y:26,duration:.6,stagger:.08,
  scrollTrigger:{trigger:'.aw-list',start:'top 82%'}});
gsap.from('.f-inner',{opacity:0,y:40,duration:.9,ease:'power3.out',
  scrollTrigger:{trigger:'#footer',start:'top 70%'}});
</script>
</body>
</html>
